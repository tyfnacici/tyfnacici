baseURL: "https://tyfnacici.com/"
locale: en-us
title: Tayfun Açıcı
pagination:
  pagerSize: 5
theme: PaperMod

ignoreLogs:
  - warning-partial-superfluous-prefix
  - warning-deprecated

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

# RSS yok — sadece HTML + sitemap
outputs:
  home: ["HTML", "SITEMAP"]
  section: ["HTML"]
  taxonomy: ["HTML"]
  term: ["HTML"]

minify:
  disableXML: true
  minifyOutput: true


params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Tayfun Açıcı
  description: "Tayfun Açıcı - Software Engineer, Blogger, and Tech Enthusiast"
  keywords:
    [
      Blog,
      Portfolio,
      Software Engineer,
      Blogger,
      Tech,
      Tayfun Açıcı,
      tyfnacici,
      Tayfun,
      Açıcı,
      Acici,
      tyfn,
    ]
  # author: Me
  # author: ["Me", "You"] # multiple authors
  images:
    [
      https://raw.githubusercontent.com/tyfnacici/tyfnacici/main/static/assets/favicon.png,
    ]
  DateFormat: "2 Jan 2006"
  defaultTheme: light # design system is light-only (approved forest-green edition)
  disableThemeToggle: true

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: false
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: true
  hideDescriptionInList: false

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "assets/favicon.png"
    favicon16x16: "assets/favicon-16.png"
    favicon32x32: "assets/favicon-32.png"
    apple_touch_icon: "assets/apple-touch-icon.png"
    safari_pinned_tab: "assets/favicon.png"

  label:
    text: " "
    icon: assets/logo.png
    iconHeight: 40

  # profile-mode
  profileMode:
    enabled: true # needs to be explicitly set
    title: Welcome, outlander!
    subtitle: "I am Tayfun Açıcı; a Web Developer, Linux lover and sometimes gamer. Passionate about coding, tech trends, and exploring new places. Let's connect!"
    imageUrl: "/assets/tyfnacici.jpeg"
    imageWidth: 300
    imageHeight: 300
    imageTitle: my image

  # Editorial home hero (design: tyfnacici-portfolio-redesign-e339, approved 31 Aug 2026)
  homeHero:
    eyebrow: "Software Engineer · Turkey"
    title: "Building things that <em>ship</em>"
    ctaPrimary: "View Projects"
    ctaSecondary: "Services"
    panelLabel: "Approach"
    panelHeadline: "From first commit to <em>shipping in production</em>"
    panelText: "I care about the whole path — thoughtful design, clean architecture, and software that genuinely ships."
    projectsTitle: "Selected Work"
    servicesTitle: "What I Do"
    blogTitle: "Recent Writing"

  # home-info mode
  homeInfoParams:
    Title: "Hi, I am Tayfun \U0001F44B"
    Content: Welcome to my website!

  socialIcons:
    - name: x
      url: "https://x.com/tyfnacici"
    - name: instagram
      url: "https://instagram.com/tyfnacici"
    - name: github
      url: "https://github.com/tyfnacici"
    - name: dev
      url: "https://dev.to/tyfnacici"
    - name: medium
      url: "https://medium.com/@tyfnacici"
    - name: linkedin
      url: "https://www.linkedin.com/in/tyfnacici/"
    - name: email
      url: "mailto:tyfnacici@gmail.com"

  analytics:
    google:
      SiteVerificationTag: "G-KJM2DXRP6H"
    bing:
      SiteVerificationTag: "4E5EA5E2553E2B9CF668990E7B46B66C"
    yandex:
      SiteVerificationTag: "0185e3c0d94b36a2"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: false # hide on list pages and home
    hiddenInSingle: false # hide on single page

  editPost:
    URL: "https://github.com/tyfnacici/tyfnacici/tree/main/content"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

menu:
  main:
    - identifier: blog
      name: blog
      url: /blog
      weight: 10
    - identifier: services
      name: services
      url: /services
      weight: 15
    - identifier: projects
      name: projects
      url: /projects
      weight: 20
    - identifier: experience
      name: experience
      url: /experience
      weight: 30

# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai

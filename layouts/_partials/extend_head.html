{{- /* Project override of themes/PaperMod/layouts/_partials/extend_head.html.
       Self-hosted fonts (static/fonts) for the approved editorial design —
       no external font CDN dependency. Theme-color metas + scheme listener. */ -}}
<link rel="stylesheet" href="{{ "fonts/roboto-flex.css" | absURL }}">
<link rel="preload" href="{{ "fonts/roboto-flex-latin.woff2" | absURL }}" as="font" type="font/woff2" crossorigin>

<script>document.documentElement.classList.add('js')</script>
<meta name="theme-color" id="theme-color-meta" content="#f4f7f1">
<meta name="msapplication-TileColor" id="ms-tilecolor-meta" content="#f4f7f1">

<script>
    // Theme: stored pref-theme ('dark'|'light') wins, otherwise follow the OS.
    // Runs in <head> so the right theme is set before first paint.
    (function () {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var KEY = 'pref-theme';
        function stored() {
            try { var v = localStorage.getItem(KEY); return v === 'dark' || v === 'light' ? v : null; } catch (e) { return null; }
        }
        function apply(theme) {
            var dark = theme === 'dark';
            document.documentElement.dataset.theme = theme;
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = dark ? '#0b1510' : '#f4f7f1'; });
            var ms = document.getElementById('ms-tilecolor-meta');
            if (ms) ms.content = dark ? '#0b1510' : '#f4f7f1';
        }
        apply(stored() || (mq.matches ? 'dark' : 'light'));
        mq.addEventListener('change', function (e) {
            if (!stored()) {
                apply(e.matches ? 'dark' : 'light');
                document.dispatchEvent(new CustomEvent('themechange', { detail: { theme: e.matches ? 'dark' : 'light' } }));
            }
        });
        window.__setTheme = function (t) {
            t = t === 'dark' ? 'dark' : 'light';
            try { localStorage.setItem(KEY, t); } catch (e) { /* storage blocked */ }
            apply(t);
            document.dispatchEvent(new CustomEvent('themechange', { detail: { theme: t } }));
        };
    })();
</script>

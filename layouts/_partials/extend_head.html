{{- /* Project override of themes/PaperMod/layouts/_partials/extend_head.html.
       Self-hosted fonts (static/fonts) for the approved editorial design —
       no external font CDN dependency. Theme-color metas + scheme listener. */ -}}
<link rel="stylesheet" href="{{ "fonts/fonts.css" | absURL }}">
<link rel="preload" href="{{ "fonts/rP2Hp2ywxg089UriCZOIHQ.woff2" | absURL }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ "fonts/nuFkD-vYSZviVYUb_rj3ij__anPXDTnogkk7.woff2" | absURL }}" as="font" type="font/woff2" crossorigin>

<meta name="theme-color" id="theme-color-meta" content="#f4f7f1">
<meta name="msapplication-TileColor" id="ms-tilecolor-meta" content="#f4f7f1">

<script>
    // Live listener for system color scheme changes
    (function() {
        const darkModeMedia = window.matchMedia('(prefers-color-scheme: dark)');

        function updateTheme(e) {
            const isDark = e.matches;
            document.querySelector('html').dataset.theme = isDark ? 'dark' : 'light';

            // Also update theme-color meta tag dynamically
            const themeColorMeta = document.getElementById('theme-color-meta');
            if (themeColorMeta) {
                themeColorMeta.content = isDark ? '#1d1e20' : '#f4f7f1';
            }
            const msTileColorMeta = document.getElementById('ms-tilecolor-meta');
            if (msTileColorMeta) {
                msTileColorMeta.content = isDark ? '#1d1e20' : '#f4f7f1';
            }
        }

        // Run on load (syncs theme-color meta on first paint)
        updateTheme(darkModeMedia);

        // Listen for changes — this is the key addition
        darkModeMedia.addEventListener('change', updateTheme);
    })();
</script>

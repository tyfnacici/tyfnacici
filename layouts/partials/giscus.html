{{- /* Giscus is created after choosing the OS theme, avoiding a wrong-theme flash.
       The listener and retry loop keep the lazy-loaded widget synchronized. */ -}}
<script>
(function () {
    'use strict';

    var LIGHT = {{ "giscus-theme.css" | absURL }};
    var DARK  = {{ "giscus-theme-dark.css" | absURL }};
    var pick = function () { return document.documentElement.dataset.theme === 'dark' ? DARK : LIGHT; };
    var requested = pick();

    var s = document.createElement('script');
    s.setAttribute('src', 'https://giscus.app/client.js');
    s.setAttribute('data-repo', 'tyfnacici/tyfnacici');
    s.setAttribute('data-repo-id', 'R_kgDOJneIFw');
    s.setAttribute('data-category', 'General');
    s.setAttribute('data-category-id', 'DIC_kwDOJneIF84ChMs1');
    s.setAttribute('data-mapping', 'pathname');
    s.setAttribute('data-strict', '0');
    s.setAttribute('data-reactions-enabled', '1');
    s.setAttribute('data-emit-metadata', '1');
    s.setAttribute('data-input-position', 'top');
    s.setAttribute('data-lang', 'tr');
    s.setAttribute('data-loading', 'lazy');
    s.setAttribute('data-theme', requested);
    s.setAttribute('crossorigin', 'anonymous');
    s.setAttribute('async', 'true');
    document.currentScript.after(s);

    function push() {
        var frame = document.querySelector('iframe.giscus-frame');
        if (!frame) return false;
        frame.contentWindow.postMessage({
            giscus: { setConfig: { theme: requested } }
        }, 'https://giscus.app');
        return true;
    }

    document.addEventListener('themechange', function () {
        requested = pick();
        push();
    });

    var attempts = 0;
    var startupSucceeded = false;
    var timer = setInterval(function () {
        attempts++;
        if (push()) {
            startupSucceeded = true;
            clearInterval(timer);
        } else if (attempts >= 30) {
            clearInterval(timer);
        }
    }, 500);

    document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible' && !startupSucceeded && push()) {
            startupSucceeded = true;
            clearInterval(timer);
        }
    });
})();
</script>
